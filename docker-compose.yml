services:
  back:
    build:
      context: ../dittopedia-back
      dockerfile: Dockerfile
    container_name: dittopedia-back
    ports:
      - "${BACK_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
    restart: unless-stopped

  front:
    build:
      context: ../dittopedia-front
      dockerfile: Dockerfile
    container_name: dittopedia-front
    ports:
      - "${FRONT_PORT:-3001}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - back
    restart: unless-stopped
