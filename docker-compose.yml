services:
  back:
    build:
      context: ../dittopedia-back
      dockerfile: Dockerfile
    container_name: dittopedia-back
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  front:
    build:
      context: ../dittopedia-front
      dockerfile: Dockerfile
    container_name: dittopedia-front
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - back
    restart: unless-stopped
