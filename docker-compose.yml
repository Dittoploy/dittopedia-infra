services:
  # ─── Application ───────────────────────────────────────────

  back:
    build:
      context: ../dittopedia-back
      dockerfile: Dockerfile
    container_name: dittopedia-back
    ports:
      - "${BACK_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000         # Frontend origin allowed by the backend (for example, CORS).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dittopedia}:${POSTGRES_PASSWORD:-dittopedia}@postgres:5432/${POSTGRES_DB:-dittopedia}
      - REDIS_URL=redis://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ../dittopedia-front
      dockerfile: Dockerfile
    container_name: dittopedia-front
    ports:
      - "${FRONT_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - back
    restart: unless-stopped

  docs:
    build:
      context: ../dittopedia-docs
      dockerfile: Dockerfile
    container_name: dittopedia-docs
    ports:
      - "${DOCS_PORT:-3002}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  # ─── Data ──────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: dittopedia-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dittopedia}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dittopedia}
      - POSTGRES_DB=${POSTGRES_DB:-dittopedia}
      - SONARQUBE_DB_PASSWORD=${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dittopedia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: dittopedia-valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Outils ────────────────────────────────────────────────

  adminer:
    image: adminer:latest
    container_name: dittopedia-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: dittopedia-sonarqube
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonarqube
      - SONAR_JDBC_PASSWORD=${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
