---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Java 17
  apt:
    name: openjdk-17-jdk
    state: present

- name: Ensure jenkins user exists
  user:
    name: jenkins
    home: /var/jenkins
    shell: /usr/sbin/nologin
    system: yes
    create_home: yes

- name: Create agent directory
  file:
    path: /var/jenkins
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Download Jenkins agent jar
  get_url:
    url: "http://{{ jenkins_master_ip }}:8080/jnlpJars/agent.jar"
    dest: /var/jenkins/agent.jar
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Create systemd service for Jenkins agent
  copy:
    dest: /etc/systemd/system/jenkins-agent.service
    owner: root
    group: root
    mode: '0644'
    force: yes
    content: |
      [Unit]
      Description=Jenkins Agent
      After=network.target

      [Service]
      User=jenkins
      WorkingDirectory=/var/jenkins
      ExecStart=/usr/bin/java -jar /var/jenkins/agent.jar -jnlpUrl http://{{ jenkins_master_ip }}:8080/computer/{{ agent_name }}/jenkins-agent.jnlp -secret {{ agent_secret }}
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: restart jenkins agent

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start Jenkins agent service
  systemd:
    name: jenkins-agent
    enabled: yes
    state: started
