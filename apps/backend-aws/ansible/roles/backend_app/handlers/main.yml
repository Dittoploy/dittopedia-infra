---
# Handlers for backend deployment

- name: Restart backend container
  community.docker.docker_container:
    name: dittopedia-backend
    state: restarted

- name: Restart valkey container
  community.docker.docker_container:
    name: valkey
    state: restarted

- name: Check backend health
  uri:
    url: "http://localhost:3000/health/live"
    method: GET
    status_code: 200
  retries: 5
  delay: 2
