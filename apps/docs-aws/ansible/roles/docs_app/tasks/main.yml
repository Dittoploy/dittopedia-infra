---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Install Python dependencies for Docker Ansible modules
  apt:
    name:
      - python3
      - python3-pip
      - python3-requests
    state: present

- name: Install Docker SDK for Python (required by community.docker modules)
  pip:
    name:
      - docker
    executable: pip3

- name: Ensure Docker is enabled and running
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Login to Docker Hub
  community.docker.docker_login:
    username: "{{ dockerhub_username }}"
    password: "{{ dockerhub_token }}"
  no_log: true

- name: Pull docs image
  community.docker.docker_image:
    name: "{{ docs_image }}"
    source: pull

- name: Run docs container
  community.docker.docker_container:
    container_default_behavior: compatibility
    name: "{{ docs_container_name }}"
    image: "{{ docs_image }}"
    restart_policy: unless-stopped
    published_ports:
      - "{{ docs_host_port }}:3000"
    state: started

- name: Logout from Docker Hub
  community.docker.docker_login:
    state: absent
